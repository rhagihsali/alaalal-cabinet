<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALAALA BOOK - 12 Albums Gallery</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#fdf6e3;color:#4a2c17}
.header{background:#d35400;color:#fff;padding:12px 10px;position:sticky;top:0;z-index:10;text-align:center;border-bottom:4px solid #8B4513}
.header h1{font-size:20px}
.header small{font-size:11px;opacity:.9}
.tabs{display:flex;gap:5px;padding:8px;background:#f9e4b7;overflow-x:auto;position:sticky;top:60px;z-index:9}
.tabs button{flex:1;min-width:70px;padding:8px 5px;border:2px solid #8B4513;border-radius:20px;background:#fff;font-weight:bold;font-size:12px;cursor:pointer}
.tabs button.active{background:#d35400;color:#fff}
.container{padding:10px}
.upload-box{background:#fff;border:2px dashed #8B4513;border-radius:10px;padding:12px;margin-bottom:15px}
.upload-box select,.upload-box input{width:100%;padding:10px;margin:6px 0;border:1px solid #8B4513;border-radius:8px}
.upload-box button{width:100%;padding:12px;background:#d35400;color:#fff;border:none;border-radius:8px;font-weight:bold;margin-top:8px;cursor:pointer}
.album-title{font-weight:bold;margin:12px 0 6px 0;padding:8px;background:#8B4513;color:#fff;border-radius:5px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:#fff;padding:2px;border:1px solid #d7c9a8}
.item{aspect-ratio:1/1;overflow:hidden;background:#000;position:relative;cursor:pointer;border:1px solid #eee}
.item img,.item video{width:100%;height:100%;object-fit:cover;display:block}
.item.info{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent, rgba(0,0,0,0.8));color:#fff;font-size:9px;padding:20px 3px 3px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-item,.audio-item{aspect-ratio:1/1;background:#fff8e1;border:1px solid #d7c9a8;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px;text-align:center;cursor:pointer}
.doc-item span.icon,.audio-item span.icon{font-size:28px}
.doc-item small,.audio-item small{font-size:9px;margin-top:4px;word-break:break-word;line-height:10px}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:100;align-items:center;justify-content:center;padding:10px;flex-direction:column}
.modal.active{display:flex}
.modal img,.modal video{max-width:100%;max-height:70vh;object-fit:contain}
.modal.cap{background:#fff;padding:10px;width:100%;max-width:500px;border-radius:8px;margin-top:10px;text-align:center}
.modal.btns{display:flex;gap:10px;width:100%;max-width:500px;margin-top:10px}
.modal.btns button{flex:1;padding:12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.btn-down{background:#27ae60;color:#fff}
.btn-del{background:#c0392b;color:#fff}
.btn-close{background:#fff;color:#333;border:1px solid #ccc!important}
.empty{grid-column:1/-1;text-align:center;padding:20px;color:#999;font-size:12px}
</style>
</head>
<body>
<div class="header">
<h1>📖 ALAALA BOOK</h1>
<small>12 Albums Lahat | Photos Videos Audios Docs | Square Gallery Size</small>
</div>
<div class="tabs">
<button class="active" onclick="showTab('photos')">📸 Photos</button>
<button onclick="showTab('videos')">🎬 Videos</button>
<button onclick="showTab('audios')">🎵 Audios</button>
<button onclick="showTab('docs')">📄 Docs</button>
</div>
<div class="container">
<div id="tab-photos">
<div class="upload-box">
<select id="photoAlbum">
<option value="1">Album 1 - Pamilya Photos</option>
<option value="2">Album 2 - Bakasyon</option>
<option value="3">Album 3 - Birthday</option>
<option value="4">Album 4 - Binyag / Kasal</option>
<option value="5">Album 5 - Graduation</option>
<option value="6">Album 6 - Lumang Larawan</option>
<option value="7">Album 7 - Bahay at Lugar</option>
<option value="8">Album 8 - Kaibigan</option>
<option value="9">Album 9 - Pagkain / Handaan</option>
<option value="10">Album 10 - Travel</option>
<option value="11">Album 11 - Sanggol / Baby</option>
<option value="12">Album 12 - Iba Pa</option>
</select>
<input type="file" id="photoFile" accept="image/*">
<input type="text" id="photoCaption" placeholder="Caption - pwede blanko ok lang">
<button onclick="savePhoto()">+ Save sa Album</button>
</div>
<div id="photoContainer"></div>
</div>
<div id="tab-videos" style="display:none">
<div class="upload-box">
<select id="videoAlbum">
<option value="1">Album 1 - Pamilya Videos</option>
<option value="2">Album 2 - Bakasyon Videos</option>
<option value="3">Album 3 - Birthday Videos</option>
<option value="4">Album 4 - Binyag / Kasal Videos</option>
<option value="5">Album 5 - Graduation Videos</option>
<option value="6">Album 6 - Lumang Videos</option>
<option value="7">Album 7 - Bahay at Lugar Videos</option>
<option value="8">Album 8 - Kaibigan Videos</option>
<option value="9">Album 9 - Kaganapan</option>
<option value="10">Album 10 - Travel Videos</option>
<option value="11">Album 11 - Baby Videos</option>
<option value="12">Album 12 - Iba Pa Videos</option>
</select>
<input type="file" id="videoFile" accept="video/*">
<input type="text" id="videoCaption" placeholder="Caption ng video - pwede blanko">
<button onclick="saveVideo()">+ Save Video</button>
</div>
<div id="videoContainer"></div>
</div>
<div id="tab-audios" style="display:none">
<div class="upload-box">
<select id="audioAlbum">
<option value="1">Album 1 - Pamilya Audio / Kwento</option>
<option value="2">Album 2 - Kanta / Kantahan</option>
<option value="3">Album 3 - Dasal / Prayers</option>
<option value="4">Album 4 - Payo ni Mama / Papa</option>
<option value="5">Album 5 - Tawanan / Kulitan</option>
<option value="6">Album 6 - Lumang Tugtog</option>
<option value="7">Album 7 - Birthday Songs</option>
<option value="8">Album 8 - Voice Message</option>
<option value="9">Album 9 - Kwento ng Buhay</option>
<option value="10">Album 10 - Turo / Aral</option>
<option value="11">Album 11 - Baby Voice</option>
<option value="12">Album 12 - Iba Pa Audio</option>
</select>
<input type="file" id="audioFile" accept="audio/*">
<input type="text" id="audioCaption" placeholder="Caption ng audio - pwede blanko">
<button onclick="saveAudio()">+ Save Audio</button>
</div>
<div id="audioContainer"></div>
</div>
<div id="tab-docs" style="display:none">
<div class="upload-box">
<select id="docAlbum">
<option value="1">Album 1 - Birth Certificate</option>
<option value="2">Album 2 - Diploma / School</option>
<option value="3">Album 3 - Marriage / Binyag</option>
<option value="4">Album 4 - ID / Documents</option>
<option value="5">Album 5 - Liham / Sulat</option>
<option value="6">Album 6 - Resibo / Lumang Papel</option>
<option value="7">Album 7 - Recipe / Luto</option>
<option value="8">Album 8 - Titulo / Lupa</option>
<option value="9">Album 9 - Medical / Health</option>
<option value="10">Album 10 - Kasaysayan / Family Tree</option>
<option value="11">Album 11 - Important Notes</option>
<option value="12">Album 12 - Iba Pa Docs</option>
</select>
<input type="file" id="docFile" accept=".pdf,.doc,.docx,.txt,.jpg,.png">
<input type="text" id="docCaption" placeholder="Caption ng document - pwede blanko">
<button onclick="saveDoc()">+ Save Doc</button>
</div>
<div id="docContainer"></div>
</div>
</div>
<div class="modal" id="modal">
<img id="modalImg" style="display:none">
<video id="modalVideo" style="display:none" controls></video>
<audio id="modalAudio" style="display:none" controls></audio>
<div class="cap" id="modalCap"></div>
<div class="btns">
<button class="btn-down" onclick="downloadCurrent()">Download</button>
<button class="btn-del" onclick="deleteCurrent()">Delete</button>
<button class="btn-close" onclick="closeModal()">Close</button>
</div>
</div>
<script>
let db=[];let currentItem=null;
try{db=JSON.parse(localStorage.getItem('alaala_v2')||'[]')}catch(e){db=[]}
function showTab(t){
 document.querySelectorAll('[id^=tab-]').forEach(e=>e.style.display='none');
 document.getElementById('tab-'+t).style.display='block';
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
 event.target.classList.add('active');
 if(t==='photos')renderPhotos(); if(t==='videos')renderVideos(); if(t==='audios')renderAudios(); if(t==='docs')renderDocs();
}
function saveFile(input,type,albumId,caption){
 const file=input.files[0]; if(!file){alert('Pili ka muna ng file boss!');return}
 const reader=new FileReader();
 reader.onload=e=>{
   db.push({id:Date.now(),type:type,album:albumId,caption:caption||'Alaala',name:file.name,data:e.target.result,date:new Date().toLocaleString()});
   localStorage.setItem('alaala_v2',JSON.stringify(db));
   input.value=''; document.getElementById(type+'Caption').value='';
   alert('Na-save na boss!'); if(type==='photo')renderPhotos(); if(type==='video')renderVideos(); if(type==='audio')renderAudios(); if(type==='doc')renderDocs();
 }; reader.readAsDataURL(file);
}
function savePhoto(){saveFile(document.getElementById('photoFile'),'photo',document.getElementById('photoAlbum').value,document.getElementById('photoCaption').value)}
function saveVideo(){saveFile(document.getElementById('videoFile'),'video',document.getElementById('videoAlbum').value,document.getElementById('videoCaption').value)}
function saveAudio(){saveFile(document.getElementById('audioFile'),'audio',document.getElementById('audioAlbum').value,document.getElementById('audioCaption').value)}
function saveDoc(){saveFile(document.getElementById('docFile'),'doc',document.getElementById('docAlbum').value,document.getElementById('docCaption').value)}
function renderPhotos(){
 const cont=document.getElementById('photoContainer'); cont.innerHTML='';
 for(let a=1;a<=12;a++){
   let items=db.filter(d=>d.type==='photo'&&d.album==a);
   let title=document.createElement('div'); title.className='album-title'; title.textContent=`Album ${a} (${items.length})`;
   cont.appendChild(title); let grid=document.createElement('div'); grid.className='grid';
   if(items.length===0){grid.innerHTML='<div class=empty>Wala pang laman</div>'}
   else{items.forEach(it=>{let div=document.createElement('div'); div.className='item'; div.innerHTML=`<img src="${it.data}"><div class=info>${it.caption}</div>`; div.onclick=()=>openModal(it); grid.appendChild(div);})}
   cont.appendChild(grid);
 }
}
function renderVideos(){
 const cont=document.getElementById('videoContainer'); cont.innerHTML='';
 for(let a=1;a<=12;a++){
   let items=db.filter(d=>d.type==='video'&&d.album==a);
   let title=document.createElement('div'); title.className='album-title'; title.textContent=`Album ${a} Videos (${items.length})`;
   cont.appendChild(title); let grid=document.createElement('div'); grid.className='grid';
   if(items.length===0){grid.innerHTML='<div class=empty>Wala pang laman</div>'}
   else{items.forEach(it=>{let div=document.createElement('div'); div.className='item'; div.innerHTML=`<video src="${it.data}"></video><div class=info>🎬 ${it.caption}</div>`; div.onclick=()=>openModal(it); grid.appendChild(div);})}
   cont.appendChild(grid);
 }
}
function renderAudios(){
 const cont=document.getElementById('audioContainer'); cont.innerHTML='';
 for(let a=1;a<=12;a++){
   let items=db.filter(d=>d.type==='audio'&&d.album==a);
   let title=document.createElement('div'); title.className='album-title'; title.textContent=`Album ${a} Audios (${items.length})`;
   cont.appendChild(title); let grid=document.createElement('div'); grid.className='grid';
   if(items.length===0){grid.innerHTML='<div class=empty>Wala pang laman</div>'}
   else{items.forEach(it=>{let div=document.createElement('div'); div.className='audio-item'; div.innerHTML=`<span class=icon>🎵</span><small>${it.caption}<br>${it.name}</small>`; div.onclick=()=>openModal(it); grid.appendChild(div);})}
   cont.appendChild(grid);
 }
}
function renderDocs(){
 const cont=document.getElementById('docContainer'); cont.innerHTML='';
 for(let a=1;a<=12;a++){
   let items=db.filter(d=>d.type==='doc'&&d.album==a);
   let title=document.createElement('div'); title.className='album-title'; title.textContent=`Album ${a} Docs (${items.length})`;
   cont.appendChild(title); let grid=document.createElement('div'); grid.className='grid';
   if(items.length===0){grid.innerHTML='<div class=empty>Wala pang laman</div>'}
   else{items.forEach(it=>{let div=document.createElement('div'); div.className=it.data.startsWith('data:image')?'item':'doc-item'; div.innerHTML=it.data.startsWith('data:image')?`<img src="${it.data}"><div class=info>${it.caption}</div>`:`<span class=icon>📄</span><small>${it.caption}<br>${it.name}</small>`; div.onclick=()=>openModal(it); grid.appendChild(div);})}
   cont.appendChild(grid);
 }
}
function openModal(it){
 currentItem=it; document.getElementById('modalImg').style.display='none'; document.getElementById('modalVideo').style.display='none'; document.getElementById('modalAudio').style.display='none';
 if(it.type==='photo'){let el=document.getElementById('modalImg');el.src=it.data;el.style.display='block'}
 if(it.type==='video'){let el=document.getElementById('modalVideo');el.src=it.data;el.style.display='block'}
 if(it.type==='audio'){let el=document.getElementById('modalAudio');el.src=it.data;el.style.display='block'}
 if(it.type==='doc'&&it.data.startsWith('data:image')){let el=document.getElementById('modalImg');el.src=it.data;el.style.display='block'}
 document.getElementById('modalCap').textContent=it.caption+' - '+it.date+' - '+it.name;
 document.getElementById('modal').classList.add('active');
}
function closeModal(){document.getElementById('modal').classList.remove('active'); document.getElementById('modalVideo').pause(); document.getElementById('modalAudio').pause(); currentItem=null}
function downloadCurrent(){if(!currentItem)return; let a=document.createElement('a'); a.href=currentItem.data; a.download=currentItem.name; a.click();}
function deleteCurrent(){if(!currentItem)return; if(confirm('Burahin na boss?')){db=db.filter(d=>d.id!==currentItem.id); localStorage.setItem('alaala_v2',JSON.stringify(db)); closeModal(); renderPhotos(); renderVideos(); renderAudios(); renderDocs();}}
renderPhotos();
</script>
</body>
</html>
